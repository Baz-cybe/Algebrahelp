    <script>
        (function () {
            var GD_PROXY_HOSTS = [
                "https://gd-proxy.webdashers.workers.dev",
                "https://webdashers.webdashersdevelopement.workers.dev/",
                "fallbackgdproxy.webdashers.workers.dev",
                "fallback2.webdashers.workers.dev"
            ];
            window._gdProxyUrl = GD_PROXY_HOSTS[0];
            window._gdProxyHosts = GD_PROXY_HOSTS;
            var activeIndex = 0;
            var nativeFetch = window.fetch.bind(window);
            function matchingHost(url) {
                for (var i = 0; i < GD_PROXY_HOSTS.length; i++) {
                    if (url.indexOf(GD_PROXY_HOSTS[i]) === 0) return GD_PROXY_HOSTS[i];
                }
                return null;
            }
            function withHost(url, oldHost, newHost) {
                return newHost + url.slice(oldHost.length);
            }
            window.fetch = function (input, init) {
                var isRequestObj = (typeof Request !== "undefined") && (input instanceof Request);
                var url = isRequestObj ? input.url : input;
                if (typeof url !== "string") {
                    return nativeFetch(input, init);
                }
            var oldHost = matchingHost(url);
                if (!oldHost) {
                    return nativeFetch(input, init);
                }
                var attempts = 0;
                var lastError = null;
                function tryHost(hostIndex) {
                    var host = GD_PROXY_HOSTS[hostIndex];
                    var attemptUrl = withHost(url, oldHost, host);
                    var attemptInput = isRequestObj ? new Request(attemptUrl, input) : attemptUrl;

                    return nativeFetch(attemptInput, init).then(function (res) {
                        if ((res.status === 429 || res.status === 503) && attempts < GD_PROXY_HOSTS.length - 1) {
                            attempts++;
                            var nextIndex = (hostIndex + 1) % GD_PROXY_HOSTS.length;
                            return tryHost(nextIndex);
                        }
                        activeIndex = hostIndex;
                        window._gdProxyUrl = host;
                        return res;
                    }, function (err) {
                        lastError = err;
                        if (attempts < GD_PROXY_HOSTS.length - 1) {
                            attempts++;
                            var nextIndex = (hostIndex + 1) % GD_PROXY_HOSTS.length;
                            return tryHost(nextIndex);
                        }
                        throw lastError;
                    });
                }
                return tryHost(activeIndex);
            };
        })();
    </script>

    <!-- ================= PASSWORD GATE ================= -->
    <script>
        // >>>>>>>>>>>> CHANGE THE PASSWORD ON THIS LINE <<<<<<<<<<<<
        const GAME_PASSWORD = "OrangeBoy1";
        // <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

        // Scripts that load only AFTER the correct password is entered (order matters)
        const GAME_SCRIPTS = [
            "assets/scripts/game/allObjects.js?latest",
            "assets/scripts/game/allLevels.js",
            "assets/scripts/libs/phaser.min.js",
            "assets/scripts/libs/pako.min.js",
            "assets/scripts/utils/cache-manager.js",
            "assets/scripts/api/GDapiWrapper.js",
            "assets/scripts/utils/api-config.js",
            "assets/scripts/api/account-api.js",
            "assets/scripts/utils/config.js",
            "assets/scripts/core/triggers.js",
            "assets/scripts/core/level.js?latest",
            "assets/scripts/core/player.js?latehkjthykhst",
            "assets/scripts/core/audio.js",
            "assets/scripts/core/loading-screen.js",
            "assets/scripts/core/level-editor.js?latest",
            "assets/scripts/core/game-scene.js?latest3",
            "assets/scripts/core/main.js"
        ];

        function loadScriptsInOrder(list, done) {
            let i = 0;
            (function next() {
                if (i >= list.length) return done();
                const s = document.createElement("script");
                s.src = list[i++];
                s.onload = next;
                s.onerror = next; // keep going even if one fails
                document.head.appendChild(s);
            })();
        }

        function startGame() {
            const gate = document.getElementById("pw-gate");
            if (gate) gate.remove();
            loadScriptsInOrder(GAME_SCRIPTS, function () {
                // Scripts loaded after page load, so fire these in case main.js waits for them
                document.dispatchEvent(new Event("DOMContentLoaded"));
                window.dispatchEvent(new Event("load"));
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            // Skip the prompt if this browser already entered the right password
            try {
                if (localStorage.getItem("wd_pw") === GAME_PASSWORD) {
                    return startGame();
                }
            } catch (e) {}

            const input = document.getElementById("pw-input");
            const btn = document.getElementById("pw-btn");
            const err = document.getElementById("pw-err");

            function submit() {
                if (input.value === GAME_PASSWORD) {
                    try { localStorage.setItem("wd_pw", GAME_PASSWORD); } catch (e) {}
                    startGame();
                } else {
                    err.textContent = "Wrong password";
                    input.value = "";
                    input.focus();
                }
            }

            btn.addEventListener("click", submit);
            input.addEventListener("keydown", function (e) {
                if (e.key === "Enter") submit();
            });
            input.focus();
        });
    </script>

<body>
    <div id="pw-gate" style="position:fixed;inset:0;z-index:99999;background:#111;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;">
        <div style="text-align:center;padding:24px;">
            <h1 style="color:#C1FB3D;margin:0 0 16px;font-size:28px;">Web Dashers</h1>
            <input id="pw-input" type="password" placeholder="Enter password" autocomplete="off"

            <br>
            <button id="pw-btn"
                style="margin-top:12px;padding:10px 24px;font-size:16px;font-weight:bold;border:none;border-radius:6px;background:#C1FB3D;color:#111;cursor:pointer;">Play</button>
            <div id="pw-err" style="color:#ff5555;margin-top:12px;min-height:20px;font-size:14px;"></div>
        </div>
    </div>
</body>
